            <div class="emoji">🎯</div>
            <div class="title">아직 분석할 오답 데이터가 없습니다</div>
            <div class="desc">기출문제 / 모의고사를 몇 회 풀어보면 자주 틀리는 개념과 회차가 이곳에 표시됩니다.</div>
          </div>
        `)
      );
      return;
    }

    /* ---------------- 1) 개념과 연결된 오답 ---------------- */
    body.appendChild(this._el(`<div class="section-title">개념별 오답 현황</div>`));
    const conceptStats = (window.ConceptsData || []).map((concept) => {
      const related = concept.relatedQuestionIds || [];
      let wrongCount = 0;
      let attemptCount = 0;
      related.forEach(({ examNumber, questionNumber }) => {
        const exam = window.ExamData && window.ExamData[examNumber];
        const q = exam && exam.questions.find((qq) => qq.questionNumber === questionNumber);
        if (!q) return;
        const p = data.questionProgress[q.id];
        if (!p) return;
        attemptCount += p.totalAttempts;
        if (p.wrongAttempts > 0) wrongCount += 1;
      });
      return { concept, related, wrongCount, attemptCount };
    });
    const conceptsWithData = conceptStats.filter((c) => c.attemptCount > 0);

    if (conceptsWithData.length === 0) {
      body.appendChild(
        this._el(`
          <div class="card empty-state" style="margin-bottom:24px;">
            <div class="title">연결된 개념의 풀이 기록이 아직 없습니다</div>
            <div class="desc">
              현재 ${window.ConceptsData ? window.ConceptsData.length : 0}개 개념 중 기출문제와 연결된 개념만
              여기에 통계가 표시됩니다. 개념 공부 페이지의 "관련 기출문제"를 풀어보면 채워집니다.
            </div>
          </div>
        `)
      );
    } else {
      const grid = document.createElement("div");
      grid.style.cssText = "display:flex; flex-direction:column; gap:8px; margin-bottom:24px;";
      conceptsWithData
        .sort((a, b) => b.wrongCount - a.wrongCount || b.attemptCount - a.attemptCount)
        .forEach(({ concept, wrongCount, attemptCount, related }) => {
          const rate = attemptCount ? Math.round((wrongCount / related.length) * 100) : 0;
          const row = this._el(`
            <button class="card pressable" style="display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; cursor:pointer;">
              <div>
                <div style="font-weight:700; font-size:13.5px;">${concept.title}</div>
                <div style="font-size:12px; color:var(--text-secondary); margin-top:3px;">${concept.eraLabel || concept.era} · 연결된 기출 ${related.length}문제 중 ${wrongCount}문제 오답</div>
              </div>
              <span class="badge ${wrongCount > 0 ? "bad" : "ok"}">${wrongCount > 0 ? `${rate}% 취약` : "양호"}</span>
            </button>
          `);
          row.addEventListener("click", () => Router.navigate(`/concepts/${concept.id}`));
          grid.appendChild(row);
        });
      body.appendChild(grid);
    }

    /* ---------------- 2) 회차별 오답 현황 ---------------- */
    body.appendChild(this._el(`<div class="section-title">회차별 오답 현황</div>`));
    const byRound = {};
    wrongEntries.forEach(({ progress, question }) => {
      const n = question.examNumber;
      if (!byRound[n]) byRound[n] = { examNumber: n, wrongQuestions: 0, wrongAttempts: 0 };
      byRound[n].wrongQuestions += 1;
      byRound[n].wrongAttempts += progress.wrongAttempts;
    });
    const roundStats = Object.values(byRound).sort((a, b) => b.wrongQuestions - a.wrongQuestions);
    const maxWrong = Math.max(...roundStats.map((r) => r.wrongQuestions), 1);
    const roundGrid = document.createElement("div");
    roundGrid.style.cssText = "display:flex; flex-direction:column; gap:8px; margin-bottom:24px;";
    roundStats.slice(0, 10).forEach((r) => {
      const pct = Math.round((r.wrongQuestions / maxWrong) * 100);
      const row = this._el(`
        <div class="card" style="padding:12px 16px;">
          <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
            <span style="font-weight:700;">제${r.examNumber}회</span>
            <span style="color:var(--text-secondary);">오답 ${r.wrongQuestions}문제 · 누적 오답 ${r.wrongAttempts}회</span>
          </div>
          <div style="height:8px; border-radius:4px; background:var(--accent-soft); overflow:hidden;">
            <div style="height:100%; width:${pct}%; background:var(--danger); border-radius:4px;"></div>
          </div>
        </div>
      `);
      row.addEventListener("click", () => Router.navigate(`/exam/${r.examNumber}`));
      row.style.cursor = "pointer";
      roundGrid.appendChild(row);
    });
    body.appendChild(roundGrid);

    /* ---------------- 3) 가장 많이 틀린 문제 ---------------- */
    body.appendChild(this._el(`<div class="section-title">가장 많이 틀린 문제 TOP ${Math.min(15, wrongEntries.length)}</div>`));
    const topWrong = wrongEntries
      .sort((a, b) => b.progress.wrongAttempts - a.progress.wrongAttempts)
      .slice(0, 15);
    const listEl = document.createElement("div");
    topWrong.forEach(({ progress, question }) => {
      const row = this._el(`
        <button class="card pressable" style="display:flex; justify-content:space-between; width:100%; text-align:left; margin-bottom:8px; cursor:pointer;">
          <div>
            <div style="font-weight:700; font-size:13.5px; margin-bottom:3px;">제${question.examNumber}회 ${question.questionNumber}번</div>
            <div style="font-size:12px; color:var(--text-secondary);">${question.text.split("\n")[0].slice(0, 50)}</div>
          </div>
          <span class="badge bad">${progress.wrongAttempts}회 오답</span>
        </button>
      `);
      row.addEventListener("click", () => Router.navigate(`/wrong-notes/${encodeURIComponent(question.id)}`));
      listEl.appendChild(row);
    });
    body.appendChild(listEl);
  },

  _el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  },
};

window.WeakConceptsPage = WeakConceptsPage;


/* ---- js/stats.js ---- */
/* ============================================================
   stats.js — 학습 통계 (/stats)
   LocalStorage에 쌓인 실제 풀이 기록만으로 집계한다 (가상 데이터 없음).
   ============================================================ */

const StatsPage = {
  render(mount) {
    const data = Storage.load();
    const qProgress = Object.values(data.questionProgress);
    const totalAttempts = qProgress.reduce((s, p) => s + p.totalAttempts, 0);
    const totalCorrect = qProgress.reduce((s, p) => s + (p.totalAttempts - p.wrongAttempts), 0);
    const overallRate = totalAttempts ? Math.round((totalCorrect / totalAttempts) * 100) : null;

    const allAttempts = [];
    (window.ExamData ? Object.keys(window.ExamData) : []).forEach((n) => {
      Storage.getExamAttempts(parseInt(n, 10)).forEach((a) => allAttempts.push(a));
    });
    allAttempts.sort((a, b) => (a.submittedAt || "").localeCompare(b.submittedAt || ""));
    const realAttempts = allAttempts.filter((a) => a.mode === "real");
    const avgScore = realAttempts.length
      ? Math.round(realAttempts.reduce((s, a) => s + a.score, 0) / realAttempts.length)
      : null;
    const bestScore = allAttempts.length ? Math.max(...allAttempts.map((a) => a.score)) : null;

    const concepts = window.ConceptsData || [];
    const completedConcepts = concepts.filter((c) => (Storage.getConceptProgress(c.id) || {}).completed).length;

    const photos = typeof collectAllPhotos === "function" ? collectAllPhotos() : [];
    const photoCounts = typeof photoStatusCounts === "function" ? photoStatusCounts(photos) : null;

    const { buckets, totalWrongQuestions } = Storage.getWrongCountBuckets();

    const page = this._el(`
      <div>
        <h1 class="page-title">학습 통계</h1>
        <p class="page-sub">지금까지 실제로 풀고 기록한 데이터만 보여줍니다.</p>

        <div class="card-grid">
          <div class="card">
            <div class="stat-label">전체 정답률</div>
            <div class="stat-value">${overallRate !== null ? overallRate + "%" : "–"}</div>
            <div class="stat-delta flat">${totalAttempts}문항 풀이 기준</div>
          </div>
          <div class="card">
            <div class="stat-label">모의고사 응시</div>
            <div class="stat-value">${allAttempts.length}<span class="stat-unit">회</span></div>
            <div class="stat-delta flat">실전모드 ${realAttempts.length}회</div>
          </div>
          <div class="card">
            <div class="stat-label">실전모드 평균 점수</div>
            <div class="stat-value">${avgScore !== null ? avgScore : "–"}${avgScore !== null ? `<span class="stat-unit">점</span>` : ""}</div>
            <div class="stat-delta flat">최고 ${bestScore !== null ? bestScore + "점" : "–"}</div>
          </div>
          <div class="card">
            <div class="stat-label">개념 학습 진행</div>
            <div class="stat-value">${completedConcepts}<span class="stat-unit">/${concepts.length}</span></div>
            <div class="stat-delta flat">완료로 표시한 개념 수</div>
          </div>
        </div>

        <div class="section-title">최근 응시 점수 추이</div>
        <div id="score-trend" style="margin-bottom:24px;"></div>

        <div class="section-title">오답 반복 횟수 분포</div>
        <div id="wrong-buckets" style="margin-bottom:24px;"></div>

        <div class="section-title">사진 학습 현황</div>
        <div id="photo-stats" style="margin-bottom:24px;"></div>

        <div class="section-title">회차별 응시 현황</div>
        <div id="round-stats"></div>
      </div>
    `);
    mount.appendChild(page);

    /* 최근 점수 추이 */
    const trendEl = page.querySelector("#score-trend");
    if (allAttempts.length === 0) {
      trendEl.appendChild(
        this._el(`<div class="card empty-state"><div class="desc">아직 응시한 모의고사가 없습니다.</div></div>`)
      );
    } else {
      const recent = allAttempts.slice(-10);
      const bar = document.createElement("div");
      bar.className = "card";
      bar.style.cssText = "display:flex; align-items:flex-end; gap:8px; height:140px; padding:16px 20px;";
      recent.forEach((a) => {
        const h = Math.max(6, Math.round((a.score / 100) * 100));
        const col = document.createElement("div");
        col.style.cssText = "flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;";
        col.innerHTML = `
          <div style="font-size:10.5px; font-weight:700; margin-bottom:4px;">${a.score}</div>
          <div style="width:100%; max-width:28px; height:${h}%; background:${a.score >= 80 ? "var(--success)" : a.score >= 60 ? "var(--warning)" : "var(--danger)"}; border-radius:4px 4px 0 0;"></div>
          <div style="font-size:9.5px; color:var(--text-tertiary); margin-top:4px;">제${a.examNumber}회</div>
        `;
        bar.appendChild(col);
      });
      trendEl.appendChild(bar);
    }

    /* 오답 반복 분포 */
    const bucketsEl = page.querySelector("#wrong-buckets");
    if (totalWrongQuestions === 0) {
      bucketsEl.appendChild(this._el(`<div class="card empty-state"><div class="desc">오답 기록이 없습니다.</div></div>`));
    } else {
      const maxB = Math.max(buckets[1], buckets[2], buckets[3], buckets[4], buckets["5+"], 1);
      const card = document.createElement("div");
      card.className = "card";
      card.style.cssText = "display:flex; flex-direction:column; gap:8px;";
      [
        ["1회", buckets[1]],
        ["2회", buckets[2]],
        ["3회", buckets[3]],
        ["4회", buckets[4]],
        ["5회+", buckets["5+"]],
      ].forEach(([label, count]) => {
        const pct = Math.round((count / maxB) * 100);
        card.innerHTML += `
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:40px; font-size:12px; color:var(--text-secondary);">${label}</div>
            <div style="flex:1; height:10px; border-radius:5px; background:var(--accent-soft); overflow:hidden;">
              <div style="height:100%; width:${pct}%; background:var(--danger);"></div>
            </div>
            <div style="width:28px; text-align:right; font-size:12px; font-weight:700;">${count}</div>
          </div>
        `;
      });
      bucketsEl.appendChild(card);
    }

    /* 사진 학습 현황 */
    const photoEl = page.querySelector("#photo-stats");
    if (!photoCounts || photos.length === 0) {
      photoEl.appendChild(this._el(`<div class="card empty-state"><div class="desc">등록된 사진이 없습니다.</div></div>`));
    } else {
      const total = photos.length;
      const seg = [
        ["안다", photoCounts.known, "var(--success)"],
        ["헷갈림", photoCounts.unsure, "var(--warning)"],
        ["모른다", photoCounts.unknown, "var(--danger)"],
        ["안 봄", photoCounts.unseen, "var(--text-tertiary)"],
      ];
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div style="display:flex; height:14px; border-radius:7px; overflow:hidden; margin-bottom:10px;">
          ${seg.map(([, count, color]) => `<div style="width:${(count / total) * 100}%; background:${color};"></div>`).join("")}
        </div>
        <div style="display:flex; gap:14px; flex-wrap:wrap; font-size:12px;">
          ${seg.map(([label, count, color]) => `<div><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${color}; margin-right:4px;"></span>${label} ${count}</div>`).join("")}
        </div>
        <div style="margin-top:10px;">
          <button class="btn secondary sm" id="go-photos">사진 학습으로 이동 →</button>
        </div>
      `;
      card.querySelector("#go-photos").addEventListener("click", () => Router.navigate("/photos"));
      photoEl.appendChild(card);
    }

    /* 회차별 응시 현황 */
    const roundEl = page.querySelector("#round-stats");
    const rounds = Object.keys(window.ExamData || {})
      .map((n) => parseInt(n, 10))
      .sort((a, b) => a - b);
    if (rounds.length === 0) {
      roundEl.appendChild(this._el(`<div class="card empty-state"><div class="desc">등록된 회차가 없습니다.</div></div>`));
    } else {
      const grid = document.createElement("div");
      grid.style.cssText = "display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px;";
      rounds.forEach((n) => {
        const attempts = Storage.getExamAttempts(n);
        const best = attempts.reduce((m, a) => Math.max(m, a.score), 0);
        const cell = this._el(`
          <button class="card pressable" style="padding:12px; text-align:left; cursor:pointer;">
            <div style="font-weight:700; font-size:13px;">제${n}회</div>
            <div style="font-size:11.5px; color:var(--text-secondary); margin-top:4px;">${attempts.length ? `최고 ${best}점 · ${attempts.length}회 응시` : "미응시"}</div>
          </button>
        `);
        cell.addEventListener("click", () => Router.navigate(`/exam/${n}`));
        grid.appendChild(cell);
      });
      roundEl.appendChild(grid);
    }
  },

  _el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  },
};

window.StatsPage = StatsPage;


/* ---- js/app.js ---- */
/* ============================================================
   app.js — 앱 셸, 내비게이션, 대시보드, 설정 페이지
   모든 메뉴(홈/개념/사진/기출문제/오답노트/취약개념/연표/암기카드/
   통계/설정)가 실제 기능으로 구현되어 있다(phase: null).
   renderComingSoon은 더 이상 쓰이는 메뉴가 없고, 정의되지 않은
   라우트로 진입했을 때의 404 대체 화면으로만 남아 있다.
   (가짜 데이터나 동작하지 않는 버튼을 완성된 것처럼 두지 않는다 — 요구사항 24.4)
   ============================================================ */

const NAV_ITEMS = [
  { path: "/", icon: "🏠", label: "홈 / 대시보드", phase: null },
  { path: "/concepts", icon: "📖", label: "개념 공부", phase: null },
  { path: "/photos", icon: "🖼️", label: "사진 학습", phase: null },
  { path: "/exam", icon: "📝", label: "기출문제 / 모의고사", phase: null },
  { path: "/wrong-notes", icon: "❌", label: "오답노트", phase: null },
  { path: "/weak-concepts", icon: "🎯", label: "취약 개념", phase: null },
  { path: "/timeline", icon: "🕰️", label: "연표 학습", phase: null },
  { path: "/flashcards", icon: "🗂️", label: "암기 카드", phase: null },
  { path: "/stats", icon: "📊", label: "학습 통계", phase: null },
  { path: "/settings", icon: "⚙️", label: "설정", phase: null },
];

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function fmtDday(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr + "T00:00:00");
  const diffDays = Math.round((target - today) / 86400000);
  return diffDays;
}

const App = {
  init() {
    this.renderShell();
    this.applyTheme(Storage.getTheme());
    this.registerRoutes();
    Router.start();
  },

  renderShell() {
    const root = document.getElementById("app");
    root.innerHTML = `
      <div class="app-shell">
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-mark">한</div>
            <div>
              <div class="brand-text">한능검 MASTER</div>
              <div class="brand-sub">한국사 심화 1급</div>
            </div>
          </div>
          <nav id="sidebar-nav"></nav>
          <div class="sidebar-footer">
            <button class="theme-toggle" id="theme-toggle-btn">
              <span id="theme-toggle-icon">🌙</span>
              <span id="theme-toggle-label">다크모드</span>
            </button>
          </div>
        </aside>
        <div class="main-area">
          <header class="topbar">
            <div class="brand">
              <div class="brand-mark">한</div>
              <div class="brand-text">한능검 MASTER</div>
            </div>
            <button class="theme-toggle" id="theme-toggle-btn-mobile" style="width:auto;">🌙</button>
          </header>
          <main class="content" id="content-mount"></main>
        </div>
        <nav class="bottom-nav">
          <div class="bottom-nav-scroll" id="bottom-nav-scroll"></div>
        </nav>
      </div>
      <div class="toast" id="toast"></div>
    `;

    const navEl = document.getElementById("sidebar-nav");
    NAV_ITEMS.forEach((item) => {
      const btn = el(`
        <button class="nav-item" data-path="${item.path}">
          <span class="icon">${item.icon}</span>
          <span>${item.label}</span>
          ${item.phase ? `<span class="badge coming-soon" style="margin-left:auto;">P${item.phase}</span>` : ""}
        </button>
      `);
      btn.addEventListener("click", () => Router.navigate(item.path));
      navEl.appendChild(btn);
    });

    const bottomNav = document.getElementById("bottom-nav-scroll");
    NAV_ITEMS.forEach((item) => {
      const btn = el(`
        <button class="bottom-nav-item" data-path="${item.path}">
          <span class="icon">${item.icon}</span>
          <span>${item.label.split(" / ")[0]}</span>
        </button>
      `);
      btn.addEventListener("click", () => Router.navigate(item.path));
      bottomNav.appendChild(btn);
    });

    document.getElementById("theme-toggle-btn").addEventListener("click", () => this.toggleTheme());
    document.getElementById("theme-toggle-btn-mobile").addEventListener("click", () => this.toggleTheme());
  },

  onRouteChange(basePath) {
    document.querySelectorAll(".nav-item, .bottom-nav-item").forEach((b) => {
      b.classList.toggle("active", b.dataset.path === basePath);
    });
  },

  applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const icon = theme === "dark" ? "☀️" : "🌙";
    const label = theme === "dark" ? "라이트모드" : "다크모드";
    const iconEl = document.getElementById("theme-toggle-icon");
    const labelEl = document.getElementById("theme-toggle-label");
    if (iconEl) iconEl.textContent = icon;
    if (labelEl) labelEl.textContent = label;
    const mobileBtn = document.getElementById("theme-toggle-btn-mobile");
    if (mobileBtn) mobileBtn.textContent = icon;
  },

  toggleTheme() {
    const next = Storage.getTheme() === "dark" ? "light" : "dark";
    Storage.setTheme(next);
    this.applyTheme(next);
  },

  showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  },

  registerRoutes() {
    Router.register("/", this.renderDashboard.bind(this));
    Router.register("/settings", this.renderSettings.bind(this));
    Router.register("/concepts", (mount, path) => StudyPage.render(mount, path));
    Router.register("/timeline", (mount) => TimelinePage.render(mount));
    Router.register("/flashcards", (mount) => FlashcardsPage.render(mount));
    Router.register("/exam", (mount, path) => ExamPage.render(mount, path));
    Router.register("/wrong-notes", (mount, path) => WrongNotesPage.render(mount, path));
    Router.register("/photos", (mount, path) => PhotosPage.render(mount, path));
    Router.register("/weak-concepts", (mount) => WeakConceptsPage.render(mount));
    Router.register("/stats", (mount) => StatsPage.render(mount));
    NAV_ITEMS.filter((i) => i.phase).forEach((item) => {
      Router.register(item.path, (mount) => this.renderComingSoon(mount, item));
    });
    Router.setNotFound((mount) => this.renderComingSoon(mount, { label: "페이지", phase: "?" }));
  },

  renderComingSoon(mount, item) {
    mount.appendChild(
      el(`
        <div>
          <h1 class="page-title">${item.label}</h1>
          <p class="page-sub">Phase ${item.phase}에서 구현됩니다.</p>
          <div class="card empty-state">
            <div class="emoji">🚧</div>
            <div class="title">아직 준비 중인 기능입니다</div>
            <div class="desc">
              이 메뉴는 현재 Phase 1(프로젝트 기반) 단계이며,
              실제 데이터와 기능은 이후 단계에서 순서대로 구현됩니다.
              버튼을 눌러도 동작하지 않도록 의도적으로 비활성화되어 있습니다.
            </div>
          </div>
        </div>
      `)
    );
  },

  renderDashboard(mount) {
    const examDate = Storage.getExamDate();
    const dday = fmtDday(examDate);
    const { totalWrongQuestions } = Storage.getWrongCountBuckets();
    const attempts = Storage.getExamAttempts();
    const lastAttempt = attempts.sort((a, b) => (b.submittedAt || "").localeCompare(a.submittedAt || ""))[0];
    const totalSolved = Object.values(Storage.load().questionProgress).reduce(
      (sum, p) => sum + p.totalAttempts,
      0
    );

    mount.appendChild(
      el(`
        <div>
          <h1 class="page-title">안녕하세요 👋</h1>
          <p class="page-sub">오늘의 학습 상태를 한눈에 확인하세요.</p>

          <div class="card-grid">
            <div class="card">
              <div class="stat-label">목표 시험일</div>
              <div class="stat-value">${examDate || "미설정"}</div>
              ${
                dday != null
                  ? `<div class="stat-delta ${dday >= 0 ? "flat" : "down"}">${dday >= 0 ? `D-${dday}` : `시험일이 지났습니다`}</div>`
                  : `<div class="stat-delta flat"><a href="#/settings" style="color:var(--accent);">설정에서 입력 →</a></div>`
              }
            </div>
            <div class="card">
              <div class="stat-label">최근 모의고사</div>
              <div class="stat-value">${lastAttempt ? `${lastAttempt.score}점` : "—"}</div>
              <div class="stat-delta flat">${lastAttempt ? `${lastAttempt.grade}급` : "아직 응시 기록 없음"}</div>
            </div>
            <div class="card">
              <div class="stat-label">누적 문제 풀이</div>
              <div class="stat-value">${totalSolved}<span class="stat-unit">문제</span></div>
              <div class="stat-delta flat">전체 누적 기준</div>
            </div>
            <div class="card">
              <div class="stat-label">반복 오답</div>
              <div class="stat-value">${totalWrongQuestions}<span class="stat-unit">문제</span></div>
              <div class="stat-delta flat">1회 이상 오답 기준</div>
            </div>
          </div>

          <div class="section-title">학습 그래프</div>
          <div class="card empty-state" style="margin-bottom:24px;">
            <div class="emoji">📈</div>
            <div class="title">아직 학습 기록이 없습니다</div>
            <div class="desc">
              모의고사를 응시하거나 문제를 풀면 점수 변화, 시대별 정답률 등의
              그래프가 이곳에 표시됩니다. (기출문제 기능은 Phase 2에서 추가됩니다)
            </div>
          </div>

          <div class="section-title">추천 학습</div>
          <div class="card empty-state">
            <div class="emoji">💡</div>
            <div class="title">학습 데이터가 쌓이면 추천이 시작됩니다</div>
            <div class="desc">
              풀이 기록과 오답 데이터를 분석해 지금 공부해야 할 개념과
              문제를 추천합니다. 아직은 추천할 데이터가 없습니다.
            </div>
          </div>
        </div>
      `)
    );
  },

  renderSettings(mount) {
    const examDate = Storage.getExamDate() || "";
    const targetGrade = Storage.get("targetGrade") || 1;
    const lastBackup = Storage.get("lastBackupAt");

    const page = el(`
      <div>
        <h1 class="page-title">설정</h1>
        <p class="page-sub">시험 목표, 테마, 데이터 백업을 관리합니다.</p>

        <div class="section-title">시험 목표</div>
        <div class="card" style="margin-bottom:24px; display:flex; flex-direction:column; gap:14px;">
          <label style="font-size:13px; font-weight:600; display:flex; flex-direction:column; gap:6px;">
            목표 시험일
            <input type="date" id="exam-date-input" value="${examDate}"
              style="padding:9px 10px; border-radius:8px; border:1px solid var(--card-border); background:var(--bg); color:var(--text-primary); font-size:13.5px;">
          </label>
          <label style="font-size:13px; font-weight:600; display:flex; flex-direction:column; gap:6px;">
            목표 등급
            <select id="target-grade-input"
              style="padding:9px 10px; border-radius:8px; border:1px solid var(--card-border); background:var(--bg); color:var(--text-primary); font-size:13.5px;">
              <option value="1" ${targetGrade === 1 ? "selected" : ""}>1급 (80점 이상)</option>
              <option value="2" ${targetGrade === 2 ? "selected" : ""}>2급 (70점 이상)</option>
              <option value="3" ${targetGrade === 3 ? "selected" : ""}>3급 (60점 이상)</option>
            </select>
          </label>
          <button class="btn" id="save-exam-goal-btn" style="align-self:flex-start;">저장</button>
        </div>

        <div class="section-title">화면 테마</div>
        <div class="card" style="margin-bottom:24px;">
          <button class="btn secondary" id="settings-theme-toggle">
            현재: ${Storage.getTheme() === "dark" ? "다크모드" : "라이트모드"} · 전환하기
          </button>
        </div>

        <div class="section-title">데이터 백업 및 복원</div>
        <div class="card" style="margin-bottom:24px; display:flex; flex-direction:column; gap:12px;">
          <p style="font-size:12.5px; color:var(--text-secondary); line-height:1.6;">
            브라우저 데이터를 삭제하면 학습 기록이 사라질 수 있습니다.
            정기적으로 백업 파일을 내보내는 것을 권장합니다.
            마지막 백업: ${lastBackup ? new Date(lastBackup).toLocaleString("ko-KR") : "없음"}
          </p>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn secondary" id="export-btn">JSON으로 내보내기</button>
            <label class="btn secondary" style="cursor:pointer;">
              JSON 가져오기
              <input type="file" accept="application/json" id="import-input" style="display:none;">
            </label>
          </div>
        </div>

        <div class="section-title">초기화</div>
        <div class="card" style="border-color: var(--danger-soft);">
          <p style="font-size:12.5px; color:var(--text-secondary); margin-bottom:10px;">
            모든 학습 기록을 삭제합니다. 이 작업은 되돌릴 수 없습니다.
          </p>
          <button class="btn" id="reset-btn" style="background:var(--danger);">전체 데이터 초기화</button>
        </div>
      </div>
    `);

    mount.appendChild(page);

    page.querySelector("#save-exam-goal-btn").addEventListener("click", () => {
      const dateVal = page.querySelector("#exam-date-input").value;
      const gradeVal = parseInt(page.querySelector("#target-grade-input").value, 10);
      Storage.setExamDate(dateVal || null);
      Storage.set("targetGrade", gradeVal);
      App.showToast("시험 목표가 저장되었습니다");
    });

    page.querySelector("#settings-theme-toggle").addEventListener("click", () => {
      App.toggleTheme();
      Router.navigate("/settings");
    });

    page.querySelector("#export-btn").addEventListener("click", () => {
      const json = Storage.exportJSON();
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `khm-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      App.showToast("백업 파일을 내보냈습니다");
      Router.navigate("/settings");
    });

    page.querySelector("#import-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const result = Storage.importJSON(reader.result, "merge");
        if (result.ok) {
          App.showToast("백업 데이터를 가져왔습니다");
          Router.navigate("/");
        } else {
          App.showToast(`가져오기 실패: ${result.error}`);
        }
      };
      reader.readAsText(file);
    });

    page.querySelector("#reset-btn").addEventListener("click", () => {
      if (confirm("정말 모든 학습 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.")) {
        Storage.resetAll();
        App.showToast("모든 데이터가 초기화되었습니다");
        Router.navigate("/");
      }
    });
  },
};

window.App = App;
document.addEventListener("DOMContentLoaded", () => App.init());

</script>
